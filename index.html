<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigos das Palavras</title>
<meta name="description" content="Lições e jogos de leitura e escrita para alunos do 4.º ano com dislexia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo com navegação, páginas de cartões grandes, jogos num palco central.
   Pensado para leitores com dislexia: letra Lexend, espaçamento largo, texto alinhado à esquerda, sem itálico. */
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1B2740; --muted:#46567A; --line:#C6D5E8; --soft:#E3EDF8;
  --ok:#1B7F3B; --okbg:#DDF3E3; --bad:#B3261E; --badbg:#FBE3E1; --on:#FFFFFF; --focus:#1B2740;
  --hl:#FFE27A; --hlink:#1B2740;
  --c0:#8A5A00; --c1:#2557C9; --c2:#6E3FCB; --c3:#0B7A6E; --c4:#B04A08; --c5:#2E7D32; --c6:#B81E56;
  --c:var(--c1);
  --display:'Fredoka','Lexend',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --surface:#18233A; --ink:#EEF3FC; --muted:#AEBBD3; --line:#2C3B5A; --soft:#1F2D49;
    --ok:#6FD58F; --okbg:#173A27; --bad:#FF9C94; --badbg:#47201E; --on:#0B1220; --focus:#EEF3FC;
    --hl:#7A6200; --hlink:#FFFFFF;
    --c0:#F2C14E; --c1:#8DB1FF; --c2:#B79BFF; --c3:#5FD6C6; --c4:#FFAA6B; --c5:#8EDB8F; --c6:#FF8FB5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#18233A; --ink:#EEF3FC; --muted:#AEBBD3; --line:#2C3B5A; --soft:#1F2D49;
  --ok:#6FD58F; --okbg:#173A27; --bad:#FF9C94; --badbg:#47201E; --on:#0B1220; --focus:#EEF3FC;
  --hl:#7A6200; --hlink:#FFFFFF;
  --c0:#F2C14E; --c1:#8DB1FF; --c2:#B79BFF; --c3:#5FD6C6; --c4:#FFAA6B; --c5:#8EDB8F; --c6:#FF8FB5;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.125rem/1.75 'Lexend',system-ui,'Segoe UI',Arial,sans-serif;
  word-spacing:.12em;letter-spacing:.015em;text-align:left;font-style:normal}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.3rem}
p{margin:.6rem 0;max-width:62ch}
a{color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:68rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:1.5rem 4rem}
.stack{display:flex;flex-direction:column;gap:1.4rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.top .bar{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between;padding-block:.5rem}
.logo{font-family:var(--display);font-weight:600;font-size:1.35rem;display:flex;gap:.5rem;align-items:center;text-decoration:none}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav a{padding:.45rem 1rem;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent}
nav a:hover{border-color:var(--line)}
nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.tools{display:flex;gap:.4rem}
.tools button{font:inherit;font-weight:700;min-width:2.8rem;min-height:2.8rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

/* botões e cartões */
.btn{font:inherit;font-weight:600;min-height:3rem;padding:.55rem 1.3rem;border-radius:14px;border:2px solid var(--c,var(--ink));
  background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:.5rem;align-items:center;justify-content:center;text-align:center}
.btn.pri{background:var(--c,var(--ink));color:var(--on)}
.btn.sm{min-height:2.5rem;padding:.3rem .9rem;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:default}
.say{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-width:2.6rem;min-height:2.6rem;cursor:pointer;font-size:1.2rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:1.2rem 1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1rem}
.grid>*{min-width:0}
.tcard{display:flex;flex-direction:column;gap:.6rem;text-decoration:none;color:inherit}
.tcard:hover{border-color:var(--c)}
.badge{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.eyebrow{font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:center}
.hero .owl{font-size:5rem;line-height:1}
@media (max-width:30rem){.hero{grid-template-columns:1fr}}
.pill{display:inline-block;padding:.1rem .7rem;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--surface));font-weight:600;font-size:.95rem}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;align-items:center;text-decoration:none;color:inherit;padding:1rem 1.1rem}
.gcard:hover{border-color:var(--c)}
.gcard .ge{font-size:2.4rem;grid-row:span 2}
.gcard .gt{font-weight:600}
.gcard .gd{font-size:.95rem;color:var(--muted);line-height:1.45}
.stars{letter-spacing:.1em;white-space:nowrap}
details{border:2px solid var(--line);border-radius:16px;padding:.7rem 1.1rem;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;min-width:40rem}
th,td{border:2px solid var(--line);padding:.5rem .7rem;vertical-align:top;font-size:1rem;line-height:1.5}
th{background:var(--soft)}

/* lições */
.lb{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.5rem}
.lb h3{display:flex;gap:.7rem;align-items:center}
.he{font-size:2.2rem}
.exs{display:flex;flex-wrap:wrap;gap:.8rem;margin:.4rem 0}
.ex{font:inherit;color:inherit;display:grid;justify-items:center;gap:.1rem;padding:.7rem 1rem;border:2px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;min-width:6.5rem;max-width:100%}
.ex:hover{border-color:var(--c)}
.ex .e{font-size:3rem;line-height:1.2}
.ex .w{font-size:1.4rem;font-weight:600}
.ex .sub{font-size:.9rem;color:var(--muted);max-width:11rem;text-align:center;line-height:1.35}
mark{background:var(--hl);color:var(--hlink);border-radius:6px;padding:0 .12em}
.sy0{color:var(--c1)} .sy1{color:var(--c4)} .sy2{color:var(--c5)} .dash{color:var(--muted);padding:0 .05em}
.steps{counter-reset:s;list-style:none;margin:.3rem 0;padding:0;display:flex;flex-direction:column;gap:.7rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.6rem 1fr;gap:.8rem;align-items:start}
.steps li::before{content:counter(s);width:2.6rem;height:2.6rem;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:700}
.list{margin:.3rem 0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.4rem}
.tip{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:16px;padding:.8rem 1.1rem}
.tip b{display:block;font-family:var(--display);color:var(--c)}
.tag{display:inline-block;font-weight:700;padding:0 .6rem;border-radius:8px;border:2px solid currentColor;font-size:.95rem}
.t-i{color:var(--c1)} .t-m{color:var(--c4)} .t-f{color:var(--c5)}
.mm{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;align-items:center}
.mm .core{grid-column:1/-1;justify-self:center;font-family:var(--display);font-size:1.4rem;padding:.6rem 1.4rem;border-radius:999px;background:var(--c);color:var(--on)}
.mm .br{border:2px solid var(--c);border-radius:14px;padding:.5rem .8rem;background:var(--surface);line-height:1.45}

/* jogos */
.stage{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:1.2rem;display:flex;flex-direction:column;gap:1rem;align-items:stretch}
.dots{display:flex;gap:.4rem;flex-wrap:wrap}
.dot{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--c);border-color:var(--c)} .dot.cur{border-color:var(--c);border-width:4px}
.prompt{font-size:1.3rem;font-weight:600;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:0}
.big{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.6rem 0;text-align:center}
.pic{font-size:5.2rem;line-height:1.1}
.word{font-size:2.6rem;font-weight:600;letter-spacing:.08em;display:inline-flex;gap:.1rem;flex-wrap:wrap;justify-content:center}
.slots{display:inline-flex;gap:.3rem;font-size:2.6rem;font-weight:600}
.slot{display:inline-grid;place-items:center;min-width:1.5em;height:1.8em;border-bottom:4px solid var(--line)}
.gap,.gapw{background:color-mix(in srgb,var(--c) 16%,var(--surface));border:3px dashed var(--c);border-radius:10px;min-width:1.7em;padding:0 .2em;display:inline-grid;place-items:center}
.gap.filled,.gapw.filled{border-style:solid;color:var(--c)}
.sep{color:var(--muted);padding:0 .1em}
.swap{display:flex;gap:1.2rem;align-items:center;justify-content:center;flex-wrap:wrap}
.swap .arrow{font-size:2.4rem}
.reveal{font-size:1.8rem;font-weight:600;min-height:2.6rem;color:var(--c)}
.spokenseq{font-size:2.4rem;font-weight:600;letter-spacing:.2em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem}
.opt{font:inherit;color:inherit;font-size:1.35rem;font-weight:600;min-height:4.2rem;padding:.6rem .8rem;border-radius:16px;border:3px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .oe{font-size:2.6rem;line-height:1.1}
.opt.ok{background:var(--okbg);border-color:var(--ok)} .opt.ok::after{content:"✓ certo";font-size:.9rem;color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.85} .opt.bad::after{content:"✕ tenta outra";font-size:.9rem;color:var(--bad)}
.opt.long{font-size:1.15rem;font-weight:500;text-align:left;align-items:flex-start}
.opts.wide{grid-template-columns:1fr}
.fb{min-height:3rem;border-radius:14px;padding:.5rem 1rem;font-weight:600;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)} .fb.info{background:var(--soft)}
.hint{background:var(--soft);border-radius:14px;padding:.7rem 1rem}
.hint .hp{display:flex;gap:.7rem;align-items:flex-start}
.hint .hpe{font-size:2rem}
.hint mark{font-weight:600}
.ans{min-height:5rem;border:3px dashed var(--line);border-radius:18px;padding:.6rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.ans.numbered .chip::before{counter-increment:n;content:counter(n);font-size:.85rem;font-weight:700;background:var(--c);color:var(--on);border-radius:50%;min-width:1.5rem;height:1.5rem;display:inline-grid;place-items:center}
.ans.numbered{counter-reset:n}
.pool{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{font:inherit;color:inherit;font-size:1.3rem;font-weight:600;padding:.5rem 1rem;border-radius:14px;border:3px solid var(--c);background:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;min-height:3rem;text-align:left}
.chip .ce{font-size:2rem;line-height:1}
.ans.good{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1.4rem}
.pairs .col{display:flex;flex-direction:column;gap:.7rem}
.pbtn{font:inherit;color:inherit;font-size:1.25rem;font-weight:600;min-height:3.8rem;border-radius:14px;border:3px solid var(--line);background:var(--bg);cursor:pointer;display:flex;gap:.6rem;align-items:center;justify-content:center;padding:.3rem .6rem;overflow-wrap:anywhere}
.pbtn .oe{font-size:2.2rem}
.pbtn.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.pbtn.done{border-color:var(--ok);background:var(--okbg);cursor:default}
.pbtn.done::after{content:"✓"}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem}
.bucket{font:inherit;color:inherit;font-size:1.25rem;font-weight:600;min-height:5rem;border-radius:18px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem}
.bucket .oe{font-size:2.2rem}
.itemcard{align-self:center;display:flex;flex-direction:column;align-items:center;border:3px solid var(--line);border-radius:20px;padding:.8rem 2rem;background:var(--bg);text-align:center}
.itemcard .pic{font-size:4.5rem}
.sentence{font-size:1.5rem;line-height:2.2;display:flex;flex-wrap:wrap;gap:.3rem .5rem}
.tok{font:inherit;color:inherit;font-size:1.5rem;padding:.05rem .5rem;border-radius:10px;border:3px solid transparent;background:transparent;cursor:pointer}
.tok:hover{border-color:var(--line)}
.tok.sel{background:var(--hl);color:var(--hlink);border-color:var(--hlink)}
.tok.miss{border:3px dashed var(--bad)}
.tok.wrong{border:3px solid var(--bad);text-decoration:line-through}
.tok.right{border-color:var(--ok);background:var(--okbg);color:var(--ink)}
.instr{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.instr li{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem .8rem;border-radius:14px;border:2px solid var(--line);font-size:1.3rem}
.instr li.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.instr li.did{opacity:.6}
.instr b.v{color:var(--c1);text-decoration:underline;text-decoration-thickness:3px}
.instr b.k{background:var(--hl);color:var(--hlink);border-radius:6px;padding:0 .2em}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.7rem}
.bi{font:inherit;color:inherit;position:relative;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.7rem .4rem;border-radius:16px;border:3px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:1.05rem;text-align:center;line-height:1.35}
.bi .oe{font-size:3.2rem;line-height:1.15}
.bi.done{border-color:var(--ok);background:var(--okbg)}
.bi .n{position:absolute;top:.3rem;right:.4rem;background:var(--ok);color:var(--on);border-radius:50%;width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.95rem}
.showbox{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.showitem{display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:1.2rem;border:3px solid var(--line);border-radius:16px;padding:.6rem 1rem;min-width:6rem}
.showitem .pic{font-size:3.6rem}
.timer{height:.7rem;border-radius:999px;background:var(--soft);overflow:hidden}
.timer i{display:block;height:100%;background:var(--c);width:100%;transition:width linear}
.result{text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center;padding:1rem 0}
.result .bigstars{font-size:3.4rem;letter-spacing:.2em}
.result .owl{font-size:4rem}

/* leitura */
.reader{display:flex;flex-direction:column;gap:.5rem}
.sent{font-size:1.5rem;line-height:1.9;padding:.2rem .8rem;border-radius:14px}
.sent.on{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.w.on{background:var(--hl);color:var(--hlink);border-radius:6px}
.range{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.range input{width:12rem;max-width:100%;accent-color:var(--c)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{background:var(--c);color:var(--on)}

/* ferramentas de escrita */
textarea,input[type=text]{font:inherit;font-size:1.2rem;line-height:1.6;width:100%;padding:.6rem .8rem;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);word-spacing:.12em}
textarea{min-height:6rem;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--c);outline:none}
label.l{font-weight:600;display:block;margin-bottom:.2rem}
.picks{display:flex;flex-wrap:wrap;gap:.5rem}
.pk{font:inherit;color:inherit;font-size:1.1rem;font-weight:600;border:3px solid var(--line);border-radius:14px;background:var(--bg);padding:.3rem .8rem;cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
.pk .oe{font-size:1.8rem}
.pk[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.check{display:flex;gap:.7rem;align-items:center;font-size:1.15rem}
.check input{width:1.6rem;height:1.6rem;accent-color:var(--c)}
.glo{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center}
.glo .ge{font-size:2.6rem}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-items:center}
.mapgrid .center{grid-column:1/-1;justify-self:center;width:min(100%,22rem)}
.mapgrid .center input{text-align:center;font-weight:700;background:var(--c);color:var(--on);border-color:var(--c)}
.mapgrid .center input::placeholder{color:var(--on);opacity:.7}
@media (max-width:34rem){.mapgrid{grid-template-columns:1fr}.pairs{gap:.6rem}.pbtn{font-size:1.1rem}}
.faces{display:flex;gap:.5rem;flex-wrap:wrap}
.rate{border:2px solid var(--line);border-radius:16px;padding:.7rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.rate .q{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.6rem 1.2rem;border-radius:999px;z-index:40;font-weight:600}
@media (prefers-reduced-motion: no-preference){
  .tcard,.gcard,.opt,.chip{transition:border-color .15s,background-color .15s}
  @keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shk .25s}
}

.tp{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;border:2px solid var(--line);border-radius:18px;padding:.7rem 1rem;background:var(--bg)}
.hp{display:flex;gap:.7rem;align-items:flex-start;margin-top:.4rem}
.hpe{font-size:2rem;line-height:1.2}
@media (max-width:40rem){.top{position:static}nav a{padding:.35rem .75rem}.pic{font-size:4.2rem}.word,.slots{font-size:2.1rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="bar">
<a class="logo" href="#inicio"><span aria-hidden="true">🦉</span> Amigos das Palavras</a>
<nav aria-label="Menu principal"><a href="#inicio" data-k="inicio">Início</a><a href="#aprender" data-k="aprender">📖 Aprender</a><a href="#jogos" data-k="jogos">🎮 Jogos</a></nav>
<div class="tools"><button id="a-minus" type="button" aria-label="Letra mais pequena">A−</button><button id="a-plus" type="button" aria-label="Letra maior">A+</button><button id="theme" type="button" aria-label="Mudar entre claro e escuro">🌓</button></div>
</div></div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
/* ===== utilitários ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,a,...kids){
  const n=document.createElement(tag); a=a||{};
  for(const k in a){const v=a[k];
    if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v);}
  kids.flat(9).forEach(x=>{if(x==null||x===false)return;n.append(x.nodeType?x:document.createTextNode(x));});
  return n;
}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='pt-PT')||vs.find(v=>v.lang.replace('_','-').startsWith('pt-PT'))||vs.find(v=>v.lang.startsWith('pt'))||null;}catch(e){}}
const canSpeak=()=>{try{return 'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;}catch(e){return false;}};
if(canSpeak()){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function say(text,rate,onend){
  if(!canSpeak()){toast('Neste aparelho não há voz. Pede a um adulto para ler.');return false;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-PT';if(voice)u.voice=voice;u.rate=rate||.85;
    if(onend)u.onend=onend;speechSynthesis.speak(u);return true;}catch(e){return false;}
}
function stopSay(){try{speechSynthesis.cancel();}catch(e){}}
function sayBtn(t,label){return el('button',{class:'say',type:'button','aria-label':label||'Ouvir',title:'Ouvir',onclick:()=>say(t)},'🔊');}

'use strict';
/* Motores de jogo reutilizáveis. Cada um chama end(estrelas, htmlExtra) no fim. */
const starsFrom=(good,total)=>{const p=total?good/total:0;return p>=.85?3:p>=.5?2:1;};
const fbBox=()=>el('div',{class:'fb info',role:'status','aria-live':'polite'},'');
function setFb(box,kind,txt){box.className='fb '+kind;box.textContent='';box.append(txt);}
function dotsRow(total,i){return el('div',{class:'dots','aria-label':'Pergunta '+(i+1)+' de '+total},Array.from({length:total},(_,k)=>el('span',{class:'dot'+(k<i?' done':k===i?' cur':'')})));}
function optBtn(o,long){
  const t=typeof o==='string'?{t:o}:o;
  return el('button',{class:'opt'+(long?' long':''),type:'button'},t.e?el('span',{class:'oe','aria-hidden':'true'},t.e):null,t.t?el('span',{class:'ot'},t.t):null);
}

/* ---- Perguntas de escolha múltipla ---- */
function runQuiz(c,items,end,cfg){
  cfg=cfg||{};
  const list=cfg.shuffle===false?items:pick(items,cfg.n||8);
  let i=0,good=0;
  function show(){
    c.innerHTML='';
    const it=list[i];let tried=false,done=false;
    const fb=fbBox();
    const prompt=el('p',{class:'prompt'},it.p,it.say?sayBtn(it.say,'Ouvir a palavra'):null);
    const big=it.big?el('div',{class:'big',html:it.big}):null;
    const opts=shuffle(it.o.map((o,k)=>({o,ok:k===it.a})));
    const long=cfg.long||opts.some(x=>(typeof x.o==='string'?x.o:x.o.t||'').length>22);
    const box=el('div',{class:'opts'+(long&&!opts.some(x=>x.o.e)?' wide':'')});
    const nextBtn=el('button',{class:'btn pri',type:'button',hidden:true,onclick:()=>{i++;i<list.length?show():end(starsFrom(good,list.length),'<p>Acertaste à primeira em '+good+' de '+list.length+'.</p>'+(cfg.endNote||''),good,list.length);}},i<list.length-1?'Continuar ➡️':'Terminar 🏁');
    opts.forEach(x=>{
      const b=optBtn(x.o,long);
      b.addEventListener('click',()=>{
        if(done||b.disabled)return;
        if(x.ok){
          done=true;b.classList.add('ok');b.disabled=true;$$('.opt',box).forEach(o=>o.disabled=true);
          if(!tried)good++;
          $$('[data-fill]',c).forEach(n=>{n.textContent=(typeof x.o==='string'?x.o:x.o.t);n.classList.add('filled');});
          $$('[data-reveal]',c).forEach(n=>{n.textContent=it.reveal||'';n.classList.add('filled');});
          setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]+(it.why?' '+it.why:''));
          if(it.say&&it.sayOnOk!==false&&(cfg.sayOnOk!==false||it.sayOnOk===true))say(it.say);
          nextBtn.hidden=false;nextBtn.focus();
        }else{
          b.classList.add('bad','shake');b.disabled=true;tried=true;
          setFb(fb,'bad','🦉 '+TRYAGAIN[rnd(TRYAGAIN.length)]);
        }
      });
      box.append(b);
    });
    c.append(dotsRow(list.length,i),prompt,big,box,fb);
    if(it.hint){
      const h=el('div',{class:'hint',hidden:true,html:it.hint});
      c.append(el('button',{class:'btn sm',type:'button',onclick:()=>{h.hidden=!h.hidden;}},'💡 Ver ajuda no texto'),h);
    }
    c.append(nextBtn);
  }
  show();
}

/* ---- Ordenar peças (sílabas, frases, histórias) ---- */
function runOrder(c,rounds,end,cfg){
  cfg=cfg||{};
  let r=0,good=0;
  function show(){
    c.innerHTML='';
    const R=rounds[r];let slip=false;
    const correct=R.items.map(x=>x.t);
    let tries=0;let order;
    do{order=shuffle(R.items.map((x,k)=>({...x,id:k})));tries++;}while(R.items.length>1&&tries<20&&order.map(x=>x.t).join('|')===correct.join('|'));
    let placed=[];
    const fb=fbBox();
    const ans=el('div',{class:'ans'+(cfg.numbered?' numbered':''),'aria-label':'A tua resposta'});
    const pool=el('div',{class:'pool'});
    const after=el('div',{});
    const nextBtn=el('button',{class:'btn pri',type:'button',hidden:true,onclick:()=>{r++;r<rounds.length?show():end(starsFrom(good,rounds.length),'<p>Acertaste à primeira em '+good+' de '+rounds.length+'.</p>');}},r<rounds.length-1?'Continuar ➡️':'Terminar 🏁');
    function chipEl(x){return el('button',{class:'chip',type:'button',onclick:()=>toggle(x)},x.e?el('span',{class:'ce','aria-hidden':'true'},x.e):null,x.t);}
    function draw(){
      ans.innerHTML='';pool.innerHTML='';
      placed.forEach(x=>ans.append(chipEl(x)));
      order.filter(x=>!placed.includes(x)).forEach(x=>pool.append(chipEl(x)));
      if(!placed.length)ans.append(el('span',{class:'muted'},R.empty||'Toca nas peças pela ordem certa.'));
    }
    function toggle(x){
      if(ans.classList.contains('good'))return;
      if(placed.includes(x))placed=placed.filter(p=>p!==x);else placed.push(x);
      draw();
      if(placed.length===R.items.length){
        if(placed.map(p=>p.t).join('|')===correct.join('|')){
          ans.classList.add('good');if(!slip)good++;
          setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]);
          pool.innerHTML='';
          if(R.after){const a=R.after(correct);after.append(a);}
          if(R.say)say(R.say);
          nextBtn.hidden=false;nextBtn.focus();
        }else{slip=true;setFb(fb,'bad','🦉 Quase! Toca numa peça para a tirar e tenta outra vez.');ans.classList.add('shake');setTimeout(()=>ans.classList.remove('shake'),300);}
      }else if(fb.classList.contains('bad')){setFb(fb,'info','');}
    }
    c.append(dotsRow(rounds.length,r),el('p',{class:'prompt'},R.p||'Põe as peças por ordem.',R.say?sayBtn(R.say):null),
      R.pic?el('div',{class:'big'},el('div',{class:'pic'},R.pic),R.title?el('div',{class:'reveal'},R.title):null):null,
      ans,pool,fb,el('div',{class:'row'},el('button',{class:'btn sm',type:'button',onclick:()=>{if(ans.classList.contains('good'))return;placed=[];setFb(fb,'info','');draw();}},'↺ Recomeçar')),after,nextBtn);
    draw();
  }
  show();
}

/* ---- Ligar pares ---- */
function runMatch(c,pairs,end,cfg){
  cfg=cfg||{};
  const fb=fbBox();let sel=null,matched=0,mist=0;
  const L=pairs.map((p,k)=>({...p.l,k})),Rr=shuffle(pairs.map((p,k)=>({...p.r,k})));
  const btn=(x,side)=>{
    const b=el('button',{class:'pbtn',type:'button'},x.e?el('span',{class:'oe','aria-hidden':'true'},x.e):null,x.t?el('span',{},x.t):null);
    b.addEventListener('click',()=>{
      if(b.classList.contains('done'))return;
      if(side==='l'){if(x.say)say(x.say);$$('.pbtn.sel',c).forEach(n=>n.classList.remove('sel'));sel={x,b};b.classList.add('sel');setFb(fb,'info','Agora escolhe o par na outra coluna.');return;}
      if(!sel){setFb(fb,'info','Primeiro escolhe uma da coluna da esquerda.');return;}
      if(sel.x.k===x.k){sel.b.classList.remove('sel');sel.b.classList.add('done');b.classList.add('done');sel=null;matched++;setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]);
        if(matched===pairs.length){const s=mist<=1?3:mist<=3?2:1;setTimeout(()=>end(s,'<p>Enganaste-te '+mist+(mist===1?' vez.':' vezes.')+'</p>'),700);}
      }else{mist++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);setFb(fb,'bad','🦉 '+TRYAGAIN[rnd(TRYAGAIN.length)]);}
    });
    return b;
  };
  c.append(el('p',{class:'prompt'},cfg.p||'Liga cada par. Escolhe à esquerda e depois à direita.'),
    el('div',{class:'pairs'},el('div',{class:'col'},L.map(x=>btn(x,'l'))),el('div',{class:'col'},Rr.map(x=>btn(x,'r')))),fb);
}

    function show(){
      c.innerHTML='';
      const it=items[i];slip=false;let busy=false;

      c.append(el('p',{class:'prompt'},cfg.p||'Onde fica? Escolhe o grupo certo.',it.say||it.t?sayBtn(it.say||it.t):null),

        el('div',{class:'buckets'},cfg.cats.map((k,ci)=>el('button',{class:'bucket',type:'button',onclick:ev=>{
          if(busy)return;
          if(ci===it.c){busy=true;total++;if(!slip)good++;setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]);i++;
            setTimeout(()=>{if(i<items.length)show();else{r++;if(r<cfg.rounds.length)round();else end(starsFrom(good,total),'<p>Acertaste à primeira em '+good+' de '+total+'.</p>');}},500);}
          else{slip=true;ev.currentTarget.classList.add('shake');setFb(fb,'bad','🦉 '+TRYAGAIN[rnd(TRYAGAIN.length)]);}
        }},k.e?el('span',{class:'oe','aria-hidden':'true'},k.e):null,k.n))),fb);

/* ---- Tocar nas palavras certas de uma frase ---- */
function runPick(c,items,end,cfg){
  cfg=cfg||{};const list=cfg.shuffle===false?items:pick(items,cfg.n||6);let i=0,good=0;
  function show(){
    c.innerHTML='';const it=list[i];let attempts=0,finished=false;const fb=fbBox();
    const want=new Set(it.ans.map(norm));
    const toks=it.s.split(' ').map(w=>({w,on:false}));
    const sent=el('div',{class:'sentence'});
    const nextBtn=el('button',{class:'btn pri',type:'button',hidden:true,onclick:()=>{i++;i<list.length?show():end(starsFrom(good,list.length),'<p>Acertaste à primeira em '+good+' de '+list.length+'.</p>');}},i<list.length-1?'Continuar ➡️':'Terminar 🏁');
    const tbtns=toks.map(t=>{const b=el('button',{class:'tok',type:'button','aria-pressed':'false',onclick:()=>{if(finished)return;t.on=!t.on;b.classList.toggle('sel',t.on);b.setAttribute('aria-pressed',t.on);}},t.w);sent.append(b);return b;});
    const check=el('button',{class:'btn pri',type:'button',onclick:()=>{
      if(finished)return;attempts++;
      let wrong=0,miss=0;
      toks.forEach((t,k)=>{const ok=want.has(norm(t.w));tbtns[k].classList.remove('miss','wrong','right');
        if(t.on&&ok)tbtns[k].classList.add('right');else if(t.on&&!ok){wrong++;tbtns[k].classList.add('wrong');}else if(!t.on&&ok){miss++;tbtns[k].classList.add('miss');}});
      if(!wrong&&!miss){finished=true;if(attempts===1)good++;setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]);check.hidden=true;nextBtn.hidden=false;nextBtn.focus();}
      else if(attempts>=2){finished=true;setFb(fb,'info','🦉 Não faz mal. As palavras com contorno tracejado eram as que faltavam.');check.hidden=true;nextBtn.hidden=false;}
      else setFb(fb,'bad','🦉 Quase! '+(miss?'Faltam '+miss+(miss===1?' palavra. ':' palavras. '):'')+(wrong?'Há '+wrong+(wrong===1?' palavra a mais.':' palavras a mais.'):'')+' Tenta outra vez.');
    }},'✔ Verificar');
    c.append(dotsRow(list.length,i),el('p',{class:'prompt'},cfg.p||'Toca nas palavras certas.',sayBtn(it.s.replace(/[«»]/g,''))),
      it.e?el('div',{class:'big'},el('div',{class:'pic'},it.e)):null,sent,el('div',{class:'row'},check),fb,nextBtn);
  }
  show();
}

      b.addEventListener('click',()=>{
        if(p>=P.seq.length||b.classList.contains('done'))return;
        if(it.id===P.seq[p]){b.classList.add('done');b.append(el('span',{class:'n'},p+1));lis[p].classList.remove('cur');lis[p].classList.add('did');p++;
          if(p<P.seq.length){lis[p].classList.add('cur');setFb(fb,'ok','Certo! Agora o passo '+(p+1)+'.');}
          else{if(!slip)good++;setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]+' Fizeste tudo pela ordem certa.');nextBtn.hidden=false;nextBtn.focus();}
        }else{slip=true;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);setFb(fb,'bad','🦉 Lê outra vez o passo '+(p+1)+' e tenta de novo.');}
      });return b;}));
    c.append(dotsRow(puzzles.length,r),el('p',{class:'prompt'},'Lê a instrução. Faz um passo de cada vez.',sayBtn(P.say)),
      el('ul',{class:'instr'},lis),board,fb,nextBtn);
  }
  show();
}

/* ---- Memória de palavras ---- */
function runSpan(c,pool,end){
  const levels=[3,4,5];let lv=0,passed=0;
  function show(){
    c.innerHTML='';const n=levels[lv];const chosen=pick(pool,n);const extra=pick(pool.filter(x=>!chosen.includes(x)),n===5?4:3);
    const all=shuffle([...chosen,...extra]);const timer=el('div',{class:'timer'},el('i',{}));const secs=3+n;
    c.append(dotsRow(levels.length,lv),el('p',{class:'prompt'},'Nível '+(lv+1)+': olha com atenção e lembra-te de '+n+' desenhos.',sayBtn(chosen.map(x=>x.t).join(', '),'Ouvir as palavras')),
      el('div',{class:'showbox'},chosen.map(x=>el('div',{class:'showitem'},el('div',{class:'pic'},x.e),x.t))),timer);
    const bar=$('i',timer);setTimeout(()=>{bar.style.transitionDuration=secs+'s';bar.style.width='0%';},60);
    setTimeout(()=>{if(!c.isConnected||!timer.isConnected)return;ask();},secs*1000+200);
    function ask(){
      c.innerHTML='';const sel=new Set();const fb=fbBox();
      const box=el('div',{class:'opts'},all.map(x=>{const b=optBtn({e:x.e,t:x.t});b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{if(b.dataset.lock)return;if(sel.has(x)){sel.delete(x);b.style.borderColor='';b.style.background='';}else{sel.add(x);b.style.borderColor='var(--c)';b.style.background='color-mix(in srgb,var(--c) 16%,var(--surface))';}b.setAttribute('aria-pressed',sel.has(x));});return b;}));
      const btns=$$('.opt',box);
      const go=el('button',{class:'btn pri',type:'button',hidden:true,onclick:()=>{lv++;lv<levels.length?show():end(Math.max(1,passed),'<p>Lembraste-te de '+passed+' de 3 níveis.</p>');}},lv<levels.length-1?'Próximo nível ➡️':'Terminar 🏁');
      const check=el('button',{class:'btn pri',type:'button',onclick:()=>{
        const ok=all.every(x=>sel.has(x)===chosen.includes(x));
        btns.forEach((b,k)=>{b.dataset.lock='1';b.disabled=true;const x=all[k];b.classList.toggle('ok',chosen.includes(x));});
        if(ok){passed++;setFb(fb,'ok','🦉 '+PRAISE[rnd(PRAISE.length)]+' Lembraste-te de todos!');}
        else setFb(fb,'info','🦉 Não faz mal! Os desenhos com ✓ eram os que viste. Vamos tentar outra vez.');
        check.hidden=true;go.hidden=false;go.focus();}},'✔ Verificar');
      c.append(dotsRow(levels.length,lv),el('p',{class:'prompt'},'Quais eram os '+n+' desenhos? Toca neles.'),box,el('div',{class:'row'},check),fb,go);
    }
  }
  show();
}

function letterOpts(ch,not){
  let d=[...(CONF[ch]||'')].filter(x=>x!==not&&x!==ch);
  const pool='abcdefglmnoprstuv'.split('').filter(x=>x!==ch&&x!==not&&!d.includes(x));
  while(d.length<2)d.push(pool.splice(rnd(pool.length),1)[0]);
  return shuffle([ch,...d.slice(0,2)]);
}

def('a-historia','abr','','📓','Escreve a tua história','Planeia, escreve e confere com a lista.',(c,end)=>{
  const st=Object.assign({who:0,where:0,prob:0,a:'',b:'',c:'',chk:[]},S.story||{});let last=null;
  const persist=()=>{S.story=st;save();};
  function group(title,list,key){

      ta('ta-b','Meio: o que acontece?','b','Um dia, '+q[1]+'. De repente…'),

        end(3,'<p><b>😊 Já consigo:</b> '+(done.length?done.join(' '):'ainda nada marcado.')+'</p><p><b>💪 Vou continuar a treinar:</b> '+(train.length?train.join(' '):'nada por agora.')+'</p><p>Mostra esta lista ao teu professor ou à tua família. Ajuda a escolher o que treinar a seguir.</p>');
      }},'✅ Ver o meu resumo')));
  }
  draw();
});

initShell();
</script>
